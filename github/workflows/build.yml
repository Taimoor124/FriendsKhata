name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o FriendsKhata.zip
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Run tests
        working-directory: FriendsKhata
        run: dotnet test tests/FriendsKhata.Tests/FriendsKhata.Tests.csproj -c Release
      - name: Build APK
        working-directory: FriendsKhata
        run: dotnet publish src/FriendsKhata.App/FriendsKhata.App.csproj -f net8.0-android -c Release -p:AndroidSdkDirectory=$ANDROID_HOME
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Friends Khata build ${{ github.run_number }}
          files: FriendsKhata/Output/FriendsKhata.apk
